# Publica la carpeta ramos-ia-mini/ en GitHub Pages (HTTPS).
# Requiere una sola vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar RAMOS IA MINI

on:
  push:
    branches: [main]
    paths: ['ramos-ia-mini/**', '.github/workflows/ramos-ia-mini-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ramos-ia-mini/tests/parser.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ramos-ia-mini
      - id: deployment
        uses: actions/deploy-pages@v4
